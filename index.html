<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Trading · Erick</title>
<style>
:root{--bg:#0b0f14;--pn:#121821;--ln:#1f2a36;--tx:#e6edf3;--mut:#8b98a5;--pos:#22c55e;--neg:#ef4444;--warn:#f59e0b;--acc:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
.num,td.n{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,20,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:16px;margin:0;font-weight:600}.mut{color:var(--mut);font-size:12px}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.live{background:var(--pos);box-shadow:0 0 6px var(--pos)}.dot.stale{background:var(--warn)}
.paper{margin:12px 16px 0;padding:8px 12px;border:1px solid #3a2f12;background:#1c1708;color:#fbbf24;border-radius:8px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:0 16px 32px}
section{margin-top:20px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ch b{font-size:15px}
.big{font-size:24px;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:10px}.kp div span{display:block;color:var(--mut);font-size:11px}.kp div b{font-size:14px;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.bar{height:4px;background:var(--ln);border-radius:2px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%}
svg.sp{width:100%;height:56px;margin-top:10px;display:block}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}th{color:var(--mut);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln)}td{padding:6px 4px;border-bottom:1px solid #18212c}th.n,td.n{text-align:right}
.empty{color:var(--mut);font-size:12px;padding:10px 0}.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:#1e293b;color:#93c5fd}
footer{color:var(--mut);font-size:11px;text-align:center;padding:16px}
</style></head><body>
<header><div><h1>Paper Trading Desk</h1><div class="mut">Bots de Erick · Alfred</div></div><div class="st"><i id="dot" class="dot"></i><span id="upd">Cargando…</span></div></header>
<div class="paper">PAPER TRADING · simulación, sin dinero real. Resultados con poca muestra; no es consejo financiero.</div>
<main>
<section id="pm5m"><h2><span>Polymarket BTC 5m</span><span class="num" id="pmu"></span></h2><div class="grid" id="pmg"><div class="empty">Cargando…</div></div></section>
<section id="compass"><h2><span>Kalshi Compass</span><span class="num" id="cpu"></span></h2><div id="cpg"><div class="empty">Cargando…</div></div></section>
</main><footer>Datos reales de la simulación · se actualiza cada minuto</footer>
<script>
const $=s=>document.getElementById(s),u=v=>v==null?'—':(v<0?'-':'')+'$'+Math.abs(v).toFixed(2),sg=v=>v==null?'—':(v>0?'+':'')+u(v),c=v=>v>0?'pos':v<0?'neg':'';
const LBL={0:['Polymarket A','(papel) &middot; &uacute;ltimos 150 s &middot; 80-91&cent;'],1:['Polymarket B','(papel) &middot; &uacute;ltimos 150 s &middot; 83-93&cent;'],2:['Polymarket C','(papel) &middot; &uacute;ltimos 40 s &middot; 85-95&cent; &middot; $10/trade']};
function spark(e){if(!e||e.length<2)return'<div class="empty">Curva disponible con más trades.</div>';const mn=Math.min(...e),mx=Math.max(...e),r=mx-mn||1,W=300,H=56;
const p=e.map((v,i)=>[(i/(e.length-1)*W).toFixed(1),(H-4-(v-mn)/r*(H-8)).toFixed(1)]);const col=e[e.length-1]>=e[0]?'#22c55e':'#ef4444';
return`<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${p.map(x=>x.join(',')).join(' ')}"/></svg>`}
function ddBar(d){const p=Math.min(100,d/10*100),col=d>=10?'var(--neg)':d>=7?'var(--warn)':'var(--pos)';return`<div class="bar"><i style="width:${p}%;background:${col}"></i></div>`}
function pmCard(b,i){const L=LBL[i]||[b.nombre,''];return`<div class="card"><div class="ch"><div><b>${L[0]}</b> <span class="mut">${L[1]}</span></div><span class="tag">${b.abiertas.length?b.abiertas.length+' abierta':'sin posición'}</span></div>
<div class="big num">${u(b.balance)}</div><div class="num ${c(b.pnl)}">${sg(b.pnl)} total</div>
<div class="kp"><div><span>P&L hoy</span><b class="num ${c(b.pnl_hoy)}">${sg(b.pnl_hoy)}</b></div><div><span>Trades hoy</span><b class="num">${b.trades_hoy??'—'}</b></div><div><span>Win rate</span><b class="num">${b.winrate==null?'—':b.winrate+'%'}</b></div>
<div><span>Trades total</span><b class="num">${b.trades}</b></div><div><span>Pérdidas hoy</span><b class="num">${b.perdidas_hoy}</b></div><div><span>Caída máx / 10%</span><b class="num">${b.max_dd}%</b>${ddBar(b.max_dd)}</div></div>
${spark(b.equity)}
${b.ultimas.length?`<table><tr><th>Hora ET</th><th>Lado</th><th class="n">Precio</th><th class="n">P&L</th></tr>${b.ultimas.map(t=>`<tr><td class="num">${t.t}</td><td>${t.lado}</td><td class="n">${t.precio}¢</td><td class="n ${c(t.pnl)}">${sg(t.pnl)}</td></tr>`).join('')}</table>`:'<div class="empty">Sin operaciones todavía.</div>'}</div>`}
function cpView(d){d=Object.assign({balance:d.saldo,pnl_total:(d.saldo??500)-500,pnl_hoy:0,trades_total:d.trades,trades_hoy:0,losses_hoy:0,max_dd:d.max_dd_pct??0,equity:[],last_trades:[]},d);const b=d;const eq=(d.equity||[]).map(x=>x.b);const lt=d.last_trades||[];return`<div class="grid"><div class="card"><div class="ch"><div><b>${d.titulo||'Tier A &middot; Compass'}</b> <span class="mut">${d.subtitulo||'(papel, en vivo) &middot; tope 99&cent; &middot; $10/trade'}</span></div><span class="tag">${d.abiertas?d.abiertas+' abierta':'sin posici&oacute;n'}</span></div><div class="big num">${u(b.balance)}</div><div class="num ${c(b.pnl_total)}">${sg(b.pnl_total)} total</div><div class="kp"><div><span>P&L hoy</span><b class="num ${c(b.pnl_hoy)}">${sg(b.pnl_hoy)}</b></div><div><span>Trades hoy</span><b class="num">${b.trades_hoy}</b></div><div><span>Win rate</span><b class="num">${b.winrate==null?'-':b.winrate+'%'}</b></div><div><span>Trades total</span><b class="num">${b.trades_total}</b></div><div><span>P&eacute;rdidas hoy</span><b class="num">${b.losses_hoy}</b></div><div><span>Ca&iacute;da m&aacute;x / 10%</span><b class="num">${b.max_dd}%</b>${ddBar(b.max_dd)}</div></div>${spark(eq)}<div class="mut" style="font-size:12px;margin:6px 0">Incluye ${d.trades_prueba||0} trades de la prueba del 27-28 oct (marcados &laquo;prueba&raquo;).</div>
${lt.length?`<table><tr><th>Hora ET</th><th>Lado</th><th class="n">Precio</th><th class="n">P&L</th></tr>${lt.map(t=>`<tr><td class="num">${t.hora}${t.origen=='prueba'?' <span class="mut">prueba</span>':t.origen=='extra'?' <span class="mut">extra</span>':''}</td><td>${t.lado}</td><td class="n">${t.precio}&cent;</td><td class="n ${c(t.pnl)}">${sg(t.pnl)}</td></tr>`).join('')}</table>`:'<div class="empty">Sin operaciones todav&iacute;a.</div>'}</div></div>`}

function age(s){const m=/(\d{4}-\d\d-\d\d) (\d\d:\d\d)/.exec(s||'');if(!m)return 1e9;const now=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));return(now-new Date(m[1]+'T'+m[2]+':00'))/6e4}
async function load(){try{const d=await(await fetch('pm5m.json?'+Date.now())).json();$('pmg').innerHTML=d.bots.map(pmCard).join('');$('pmu').textContent=d.actualizado;
const a=age(d.actualizado);$('dot').className='dot '+(a<20?'live':'stale');$('upd').textContent=(a<20?'En vivo · ':'Sin actualizar · ')+d.actualizado}catch(e){$('pmg').innerHTML='<div class="empty">Sin datos todavía.</div>';$('dot').className='dot stale';$('upd').textContent='Sin conexión'}
try{const d=await(await fetch('compass.json?'+Date.now())).json();let h=cpView(d);try{const d2=await(await fetch('compass2.json?'+Date.now())).json();h+=cpView(d2)}catch(e){}$('cpg').innerHTML=h;$('cpu').textContent=d.actualizado}catch(e){$('cpg').innerHTML='<div class="empty">Sin datos de Compass.</div>'}}
load();setInterval(load,60000);
</script></body></html>
